services:
  tts:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      POCKET_TTS_MODEL_DIR: /models
      TTS_MAX_QUEUE_SIZE: ${TTS_MAX_QUEUE_SIZE:-10}
      TTS_CLIENT_OUTPUT_QUEUE_SIZE: ${TTS_CLIENT_OUTPUT_QUEUE_SIZE:-10}
      TTS_CLIENT_SEND_TIMEOUT: ${TTS_CLIENT_SEND_TIMEOUT:-5}
      TTS_CLIENT_INPUT_STREAMS: ${TTS_CLIENT_INPUT_STREAMS:-10}
      TTS_TEXT_SEGMENT_CHARS: ${TTS_TEXT_SEGMENT_CHARS:-80}
      TTS_MAX_TEXT_LENGTH: ${TTS_MAX_TEXT_LENGTH:-50000}
      TTS_TEXT_IDLE_TIMEOUT: ${TTS_TEXT_IDLE_TIMEOUT:-20}
      TTS_PENDING_TEXT_CHARS: ${TTS_PENDING_TEXT_CHARS:-400}
    restart: unless-stopped
